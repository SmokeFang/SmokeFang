<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#03050a"/>
    <stop offset="50%" stop-color="#0a0f18"/>
    <stop offset="100%" stop-color="#03050a"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1f6feb"/>
    <stop offset="50%" stop-color="#79c0ff"/>
    <stop offset="100%" stop-color="#1f6feb"/>
  </linearGradient>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#141d29" stroke-width="1"/>
  </pattern>

  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
    <circle cx="3.5" cy="3.5" r="1.1" fill="#5fb2ff"/>
  </pattern>

  <clipPath id="foxShape">
    <polygon points="1010,40 1070,90 1095,150 1090,230 1045,300 985,285 935,250 900,220 830,195 865,175 905,140 955,95 985,65"/>
  </clipPath>

  <radialGradient id="fade" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="70%" stop-color="#ffffff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <mask id="fadeMask">
    <rect x="800" y="10" width="380" height="340" fill="url(#fade)"/>
  </mask>
</defs>

<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#grid)" opacity="0.5"/>

<g opacity="0.35" font-family="monospace" font-size="10" text-anchor="middle">
  <g>
    <text>
      <tspan x="16" dy="0"  fill="#6fb4ff" fill-opacity="0.8">1</tspan>
      <tspan x="16" dy="14" fill="#3d7fd6" fill-opacity="0.5">0</tspan>
      <tspan x="16" dy="14" fill="#1f6feb" fill-opacity="0.3">F</tspan>
      <tspan x="16" dy="14" fill="#1f6feb" fill-opacity="0.15">0</tspan>
    </text>
    <animateTransform attributeName="transform" type="translate" from="0,-80" to="0,400" dur="6s" begin="-1s" repeatCount="indefinite"/>
  </g>
  <g>
    <text>
      <tspan x="1184" dy="0"  fill="#6fb4ff" fill-opacity="0.8">0</tspan>
      <tspan x="1184" dy="14" fill="#3d7fd6" fill-opacity="0.5">A</tspan>
      <tspan x="1184" dy="14" fill="#1f6feb" fill-opacity="0.3">1</tspan>
      <tspan x="1184" dy="14" fill="#1f6feb" fill-opacity="0.15">F</tspan>
    </text>
    <animateTransform attributeName="transform" type="translate" from="0,-80" to="0,400" dur="7s" begin="-3s" repeatCount="indefinite"/>
  </g>
</g>

<rect x="3" y="3" width="1194" height="354" rx="20" fill="none" stroke="#24405e" stroke-width="1.5" opacity="0.9"/>

<rect x="34" y="30" width="726" height="300" rx="14" fill="#0a0f17" stroke="#1c2b3d" stroke-width="1.5"/>

<circle cx="60" cy="52" r="5" fill="#ff5f56"/>
<circle cx="78" cy="52" r="5" fill="#ffbd2e"/>
<circle cx="96" cy="52" r="5" fill="#27c93f"/>
<text x="397" y="57" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="1" fill="#5c7691">whoami.sh</text>
<text x="738" y="57" text-anchor="end" font-family="monospace" font-size="11" fill="#3da9ff">● ONLINE</text>
<line x1="34" y1="76" x2="760" y2="76" stroke="#182636" stroke-width="1"/>

<g font-family="monospace" font-size="15">
  <text x="58" y="112" fill="#4db8ff" font-weight="bold">$ whoami</text>

  <text x="58" y="150">
    <tspan fill="#54718f">NAME      </tspan><tspan fill="#2f4a63">&gt;</tspan><tspan fill="#ffffff" font-weight="bold"> SmokeFang</tspan>
  </text>
  <text x="58" y="180">
    <tspan fill="#54718f">ROLE      </tspan><tspan fill="#2f4a63">&gt;</tspan><tspan fill="#d7e6f5"> Independent Developer</tspan>
  </text>
  <text x="58" y="210">
    <tspan fill="#54718f">FOCUS     </tspan><tspan fill="#2f4a63">&gt;</tspan><tspan fill="#d7e6f5"> Local AI • Automation • Game Systems</tspan>
  </text>
  <text x="58" y="240">
    <tspan fill="#54718f">CURRENT   </tspan><tspan fill="#2f4a63">&gt;</tspan><tspan fill="#79c0ff" font-weight="bold"> ONYX</tspan>
  </text>

  <text x="58" y="278" fill="#4db8ff" font-weight="bold">$ _</text>
  <rect x="82" y="266" width="9" height="14" fill="#4db8ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</g>

<rect x="58" y="300" width="672" height="6" rx="3" fill="#101923"/>
<rect x="58" y="300" width="440" height="6" rx="3" fill="url(#accent)"/>
<rect x="58" y="300" width="36" height="6" rx="3" fill="#bfe1ff" opacity="0.55">
  <animateTransform attributeName="transform" type="translate" values="0,0; 596,0; 0,0" dur="3.5s" repeatCount="indefinite"/>
</rect>

<g>
  <rect x="784" y="120" width="9" height="9" fill="#3d7fd6" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="805" y="160" width="7" height="7" fill="#1f6feb" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,7; 0,0" dur="4s" begin="-1s" repeatCount="indefinite"/>
  </rect>
  <rect x="778" y="200" width="6" height="6" fill="#79c0ff" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3.4s" begin="-2s" repeatCount="indefinite"/>
  </rect>
</g>

<g mask="url(#fadeMask)">
  <rect x="800" y="10" width="380" height="340" fill="url(#dots)" clip-path="url(#foxShape)"/>
</g>

<g fill="#5fb2ff">
  <circle cx="815" cy="110" r="1.4" opacity="0.6"/>
  <circle cx="1105" cy="95" r="1.4" opacity="0.5"/>
  <circle cx="1120" cy="260" r="1.6" opacity="0.6"/>
  <circle cx="1140" cy="200" r="1.2" opacity="0.4"/>
  <circle cx="1095" cy="300" r="1.6" opacity="0.5"/>
  <circle cx="820" cy="230" r="1.3" opacity="0.45"/>
</g>

<circle cx="888" cy="168" r="4.5" fill="#8fd1ff" filter="url(#glow)"/>
<circle cx="833" cy="196" r="3" fill="#1a2733"/>

<g>
  <rect x="1108" y="298" width="8" height="8" fill="#3d7fd6" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1126" y="310" width="6" height="6" fill="#1f6feb" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,6; 0,0" dur="3.8s" begin="-1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1140" y="292" width="7" height="7" fill="#79c0ff" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="2.8s" begin="-0.6s" repeatCount="indefinite"/>
  </rect>
</g>

</svg>
